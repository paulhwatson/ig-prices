[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prices"
version = "0.1.0"
description = "Hourly OHLCV price collection from Financial Modeling Prep"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "requests",
    "python-dotenv",
    "lightstreamer-client-lib",
]

[project.scripts]
prices = "prices.main:main"

[tool.setuptools.packages.find]
include = ["prices*"]
